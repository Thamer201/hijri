<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>حساب التاريخ الهجري بعد 10 و30 يوم</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment-hijri@3.0.0/moment-hijri.min.js"></script>
  <style>
    body {
      font-family: Arial;
      font-size: 20px;
      text-align: center;
      margin-top: 40px;
      direction: rtl;
      background-color: #f0f0f0;
    }
    select, input {
      margin: 8px;
      padding: 14px;
      font-size: 22px;
      width: 200px;
    }
    button {
      padding: 14px 28px;
      font-size: 20px;
      margin-top: 12px;
      cursor: pointer;
    }
    #result {
      margin-top: 24px;
      font-weight: bold;
      font-size: 20px;
      color: #333;
      white-space: pre-line;
    }
    h2 {
      color: #444;
      font-size: 24px;
    }
    #logo {
      margin-top: 30px;
      font-size: 12px;
      font-weight: bold;
      color: white;
      background-color: #444;
      width: 30px;
      height: 30px;
      line-height: 30px;
      border-radius: 50%;
      display: inline-block;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      user-select: none;
    }
  </style>
</head>
<body>
  <h2>اختر أو أدخل تاريخ هجري</h2>

  <input list="days" id="day" placeholder="اليوم">
  <datalist id="days">
    <script>
      for (let d = 1; d <= 30; d++) {
        document.write(`<option value="${d}">${d}</option>`);
      }
    </script>
  </datalist>

  <input list="months" id="month" placeholder="الشهر">
  <datalist id="months">
    <option value="1">محرم</option>
    <option value="2">صفر</option>
    <option value="3">ربيع الأول</option>
    <option value="4">ربيع الآخر</option>
    <option value="5">جمادى الأولى</option>
    <option value="6">جمادى الآخرة</option>
    <option value="7">رجب</option>
    <option value="8">شعبان</option>
    <option value="9">رمضان</option>
    <option value="10">شوال</option>
    <option value="11">ذو القعدة</option>
    <option value="12">ذو الحجة</option>
  </datalist>

  <input list="years" id="year" placeholder="السنة" value="1447">
  <datalist id="years">
    <script>
      for (let y = 1443; y <= 1450; y++) {
        document.write(`<option value="${y}">${y}</option>`);
      }
    </script>
  </datalist>

  <br>
  <button onclick="calculateHijri()">احسب</button>
  <div id="result"></div>
  <div id="logo">th</div>

  <script>

    // دالة ترجمة أيام الأسبوع للعربي
    function arabicDayName(eng) {
      const days = {
        "Sunday": "الأحد",
        "Monday": "الإثنين",
        "Tuesday": "الثلاثاء",
        "Wednesday": "الأربعاء",
        "Thursday": "الخميس",
        "Friday": "الجمعة",
        "Saturday": "السبت"
      };
      return days[eng] || eng;
    }

    function calculateHijri() {
      const day = document.getElementById("day").value;
      const month = document.getElementById("month").value;
      const year = document.getElementById("year").value;

      if (!day || !month || !year) {
        document.getElementById("result").innerText = "يرجى إدخال تاريخ هجري صحيح";
        return;
      }

      const hijriDate = moment(`${year}-${month}-${day}`, 'iYYYY-iM-iD');

      const after10 = hijriDate.clone().add(10, 'days');
      const after30 = hijriDate.clone().add(30, 'days');

      const gregorian10 = moment(after10.format('YYYY-MM-DD')).format('D-MM-YYYY');
      const gregorian30 = moment(after30.format('YYYY-MM-DD')).format('D-MM-YYYY');

      // استخراج اسم اليوم
      const day10 = arabicDayName(after10.format('dddd'));
      const day30 = arabicDayName(after30.format('dddd'));

      document.getElementById("result").innerText =
        `📅 التاريخ بعد 10 أيام (من اليوم التالي):\n` +
        `اليوم: ${day10}\n` +
        `هجري: ${after10.iDate()}-${after10.iMonth() + 1}-${after10.iYear()} هـ\n` +
        `ميلادي: ${gregorian10} م\n\n` +

        `📅 التاريخ بعد 30 يوم (من اليوم التالي):\n` +
        `اليوم: ${day30}\n` +
        `هجري: ${after30.iDate()}-${after30.iMonth() + 1}-${after30.iYear()} هـ\n` +
        `ميلادي: ${gregorian30} م`;
    }
  </script>
</body>
</html>
