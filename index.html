<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>حساب التاريخ الهجري بعد 10 و30 يوم</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment-hijri@3.0.0/moment-hijri.min.js"></script>

  <style>
    body {
      font-family: Arial;
      font-size: 20px;
      text-align: center;
      margin-top: 40px;
      direction: rtl;
      background-color: #f0f0f0;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* وضع ليلي */
    .dark {
      background-color: #1a1a1a;
      color: #fff;
    }

    /* تأثير عند الضغط على زر الوضع الليلي */
    .dark-transition {
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    select, input {
      margin: 8px;
      padding: 14px;
      font-size: 22px;
      width: 200px;
    }

    button {
      padding: 14px 28px;
      font-size: 20px;
      margin-top: 12px;
      cursor: pointer;
    }

    /* صندوق النتائج مع خلفية خفيفة */
    #resultBox {
      margin-top: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #ffffff, #f7f7f7);
      width: 80%;
      margin-left: auto;
      margin-right: auto;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      text-align: right;
      transition: 0.4s;
      display: none;
    }

    /* خلفية الصندوق في الوضع الليلي */
    .dark #resultBox {
      background: linear-gradient(135deg, #2a2a2a, #1f1f1f);
      color: #fff;
      box-shadow: 0 3px 10px rgba(255,255,255,0.1);
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #444;
    }

    .dark .title {
      color: #ddd;
    }

    .line {
      margin-bottom: 12px;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon {
      font-size: 22px;
    }

    #logo {
      margin-top: 30px;
      font-size: 12px;
      font-weight: bold;
      color: white;
      background-color: #444;
      width: 30px;
      height: 30px;
      line-height: 30px;
      border-radius: 50%;
      display: inline-block;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      user-select: none;
    }

    #darkBtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body class="dark-transition">

  <h2>اختر أو أدخل تاريخ هجري</h2>

  <input list="days" id="day" placeholder="اليوم">
  <datalist id="days">
    <script>
      for (let d = 1; d <= 30; d++) {
        document.write(`<option value="${d}">${d}</option>`);
      }
    </script>
  </datalist>

  <input list="months" id="month" placeholder="الشهر">
  <datalist id="months">
    <option value="1">محرم</option>
    <option value="2">صفر</option>
    <option value="3">ربيع الأول</option>
    <option value="4">ربيع الآخر</option>
    <option value="5">جمادى الأولى</option>
    <option value="6">جمادى الآخرة</option>
    <option value="7">رجب</option>
    <option value="8">شعبان</option>
    <option value="9">رمضان</option>
    <option value="10">شوال</option>
    <option value="11">ذو القعدة</option>
    <option value="12">ذو الحجة</option>
  </datalist>

  <input list="years" id="year" placeholder="السنة" value="1447">
  <datalist id="years">
    <script>
      for (let y = 1443; y <= 1450; y++) {
        document.write(`<option value="${y}">${y}</option>`);
      }
    </script>
  </datalist>

  <br>
  <button onclick="calculateHijri()">احسب</button>

  <button id="darkBtn" onclick="toggleDark()">تبديل الوضع الليلي</button>

  <div id="resultBox"></div>

  <div id="logo">th</div>

  <script>

    function arabicDayName(eng) {
      const days = {
        "Sunday": "الأحد",
        "Monday": "الإثنين",
        "Tuesday": "الثلاثاء",
        "Wednesday": "الأربعاء",
        "Thursday": "الخميس",
        "Friday": "الجمعة",
        "Saturday": "السبت"
      };
      return days[eng] || eng;
    }

    function isHoliday(dayName) {
      return (dayName === "الجمعة" || dayName === "السبت") ? " (عطلة رسمية)" : "";
    }

    function toggleDark() {
      document.body.classList.toggle("dark");
    }

    function calculateHijri() {
      const day = document.getElementById("day").value;
      const month = document.getElementById("month").value;
      const year = document.getElementById("year").value;

      if (!day || !month || !year) {
        alert("يرجى إدخال تاريخ هجري صحيح");
        return;
      }

      const hijriDate = moment(`${year}-${month}-${day}`, 'iYYYY-iM-iD');

      const after10 = hijriDate.clone().add(10, 'days');
      const after30 = hijriDate.clone().add(30, 'days');

      const gregorian10 = moment(after10.format('YYYY-MM-DD')).format('D-MM-YYYY');
      const gregorian30 = moment(after30.format('YYYY-MM-DD')).format('D-MM-YYYY');

      const day10 = arabicDayName(after10.format('dddd'));
      const day30 = arabicDayName(after30.format('dddd'));

      const holiday10 = isHoliday(day10);
      const holiday30 = isHoliday(day30);

      document.getElementById("resultBox").style.display = "block";

      document.getElementById("resultBox").innerHTML = `
        <div class="title">📅 التاريخ بعد 10 أيام</div>

        <div class="line"><span class="icon">📌</span> اليوم: ${day10}${holiday10}</div>
        <div class="line"><span class="icon">🌙</span> هجري: ${after10.iDate()}-${after10.iMonth() + 1}-${after10.iYear()} هـ</div>
        <div class="line"><span class="icon">☀️</span> ميلادي: ${gregorian10} م</div>

        <hr>

        <div class="title">📅 التاريخ بعد 30 يوم</div>

        <div class="line"><span class="icon">📌</span> اليوم: ${day30}${holiday30}</div>
        <div class="line"><span class="icon">🌙</span> هجري: ${after30.iDate()}-${after30.iMonth() + 1}-${after30.iYear()} هـ</div>
        <div class="line"><span class="icon">☀️</span> ميلادي: ${gregorian30} م</div>
      `;
    }
  </script>

</body>
</html>
